display_name: Vert.x Redis Client
description: >
  This instrumentation enables database client spans and database client metrics for Redis operations
  using the Vert.x Redis Client library.
library_link: https://vertx.io/docs/vertx-redis-client/java/
semantic_conventions:
  - DATABASE_CLIENT_SPANS
  - DATABASE_CLIENT_METRICS
configurations:
  - ref: common.db.query-sanitization.enabled
  - ref: common.peer-service-mapping
  - name: otel.instrumentation.vertx-redis-client.query-sanitization.enabled
    declarative_name: java.vertx_redis_client.query_sanitization.enabled
    description: >
      Enables query sanitization for Vert.x Redis client queries. Takes precedence over
      otel.instrumentation.common.db.query-sanitization.enabled.
    type: boolean
    default: true
  - name: otel.instrumentation.vertx-redis-client.statement-sanitizer.enabled
    declarative_name: java.vertx_redis_client.statement_sanitizer.enabled
    description: "Deprecated: use `otel.instrumentation.vertx-redis-client.query-sanitization.enabled` instead. It is ignored under v3 preview and will be removed in 3.0."
    type: boolean
    default: true
