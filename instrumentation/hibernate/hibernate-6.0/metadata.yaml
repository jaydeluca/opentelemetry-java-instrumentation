display_name: Hibernate
description: This instrumentation enables spans for Hibernate ORM operations.
library_link: https://hibernate.org/
configurations:
  - name: otel.instrumentation.hibernate.experimental-span-attributes
    declarative_name: java.hibernate.experimental_span_attributes/development
    description: Enables the experimental `hibernate.session_id` span attribute.
    type: boolean
    default: false
  - name: otel.instrumentation.hibernate.query-sanitization.enabled
    declarative_name: java.hibernate.query_sanitization.enabled
    description: >
      Enables query sanitization for Hibernate queries. Takes precedence over
      otel.instrumentation.common.db.query-sanitization.enabled.
    type: boolean
    default: true
  - name: otel.instrumentation.hibernate.statement-sanitizer.enabled
    declarative_name: java.hibernate.statement_sanitizer.enabled
    description: "Deprecated: use `otel.instrumentation.hibernate.query-sanitization.enabled` instead. It is ignored under v3 preview and will be removed in 3.0."
    type: boolean
    default: true
